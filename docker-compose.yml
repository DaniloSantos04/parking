services:
  mysql:
    image: mysql:8.4
    container_name: parking-mysql
    environment:
      MYSQL_DATABASE: parking
      MYSQL_USER: parking
      MYSQL_PASSWORD: parking
      MYSQL_ROOT_PASSWORD: root
      TZ: UTC
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uparking", "-pparking"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
