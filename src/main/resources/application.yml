spring:
  application:
    name: parking
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/parking?connectionTimeZone=UTC}
    username: ${DB_USERNAME:parking}
    password: ${DB_PASSWORD:parking}
  jpa:
    open-in-view: false
    hibernate:
      # O schema é responsabilidade do Flyway; o Hibernate só confere se as entidades batem com ele.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration

server:
  # O simulador envia os eventos para http://localhost:3003/webhook
  port: 3003
