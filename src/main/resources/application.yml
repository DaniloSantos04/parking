spring:
  application:
    name: parking
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/parking?connectionTimeZone=UTC}
    username: ${DB_USERNAME:parking}
    password: ${DB_PASSWORD:parking}
  jpa:
    open-in-view: false
    hibernate:
      # O schema é responsabilidade do Flyway; o Hibernate só confere se as entidades batem com ele.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  http:
    client:
      # Timeouts do RestClient: uma tentativa de carga não pode ficar pendurada indefinidamente.
      connect-timeout: 2s
      read-timeout: 5s

server:
  # O simulador envia os eventos para http://localhost:3003/webhook
  port: 3003

estapar:
  simulator:
    base-url: ${SIMULATOR_URL:http://localhost:3000}
    retry:
      max-attempts: 5
      interval: 5s
